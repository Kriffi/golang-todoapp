services:
  - type: web
    name: kriffi-todoapp
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./cmd/todoapp/Dockerfile
    dockerContext: .
    dockerCommand: /app/start-render.sh
    healthCheckPath: /healthz
    envVars:
      - key: HTTP_SHUTDOWN_TIMEOUT
        value: 30s
      - key: LOGGER_FOLDER
        value: /tmp/todoapp-logs
      - key: LOGGER_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
